<script>
// Demo: disable Web Bluetooth so the app never opens a device pairing prompt.
try{Object.defineProperty(Navigator.prototype,'bluetooth',{get:function(){return undefined},configurable:true});}catch(e){}
try{Object.defineProperty(navigator,'bluetooth',{value:undefined,configurable:true});}catch(e){}
</script>
